<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purohit Trading - Premium Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { background-color: #0b111e; color: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Auth Screen Layer */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #111827 0%, #070a12 100%); display: flex; justify-content: center; align-items: center; z-index: 99999; padding: 20px; }
        .auth-vault { background: linear-gradient(145deg, #111c30, #0c1322); border: 2px solid #38bdf8; border-radius: 24px; width: 100%; max-width: 350px; padding: 30px; box-shadow: 0 0 35px rgba(56, 189, 248, 0.25); text-align: center; }
        
        .app-logo { width: 90px; height: 90px; object-fit: contain; margin-bottom: 15px; border-radius: 50%; border: 2px solid #38bdf8; padding: 3px; background-color: #0b111e; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .auth-title { color: #38bdf8; font-size: 22px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .auth-subtitle { color: #64748b; font-size: 12px; margin-bottom: 25px; text-transform: uppercase; }
        
        /* App Layout */
        .container { max-width: 100%; margin: 0 auto; padding: 10px; }
        #main-app { display: none; } 
        .header-container { display: flex; justify-content: space-between; align-items: center; padding: 10px; gap: 10px; }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 40px; height: 40px; object-fit: contain; border-radius: 50%; border: 1px solid #38bdf8; }
        .header h1 { color: #38bdf8; font-size: 18px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .btn-logout { background-color: #ef4444; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px; }
        
        /* Tabs Menu */
        .tab-menu { display: flex; overflow-x: auto; background-color: #1e293b; border-radius: 8px; padding: 4px; margin-bottom: 15px; gap: 4px; }
        .tab-btn { flex: 0 0 auto; min-width: 120px; text-align: center; padding: 12px 8px; cursor: pointer; color: #94a3b8; font-weight: bold; font-size: 12px; border-radius: 6px; white-space: nowrap; }
        .tab-btn.active { background-color: #38bdf8; color: #0b111e; }
        
        /* Forms & Cards */
        .card { background-color: #141e30; border: 1px solid #243b55; border-radius: 12px; padding: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .hidden { display: none !important; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input, textarea, select { width: 100%; padding: 11px; background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 14px; box-sizing: border-box; }
        
        .row-grid { display: flex; gap: 10px; }
        .col-grid { flex: 1; }
        .calc-preview { background-color: #1e293b; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 15px; border: 1px dashed #38bdf8; }
        .profit-text { color: #4ade80 !important; }
        .loss-text { color: #f87171 !important; }
        
        .btn-submit-action { display: block; width: 100%; text-align: center; background-color: #0284c7; color: white; border: none; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; text-decoration: none; }

        /* Action Buttons Inside Table */
        .btn-edit { background-color: #eab308; color: #000; border: none; padding: 4px 8px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-right: 5px; font-size: 11px; }
        .btn-delete { background-color: #ef4444; color: #fff; border: none; padding: 4px 8px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 11px; }

        /* Tables */
        .total-banner { background-color: #1e293b; padding: 12px 15px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-bottom: 15px; display: flex; justify-content: space-between; border-left: 4px solid #38bdf8; }
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #23395d; text-align: left; white-space: nowrap; }
        th { background-color: #1e293b; color: #38bdf8; }
        
        /* Gallery Media System (CRITICAL FIX FOR PHOTOS) */
        .gallery-item { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .gallery-meta { display: flex; justify-content: space-between; font-size: 12px; color: #38bdf8; margin-bottom: 10px; font-weight: bold; }
        .gallery-img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; background-color: #0b111e; border: 1px solid #243b55; margin-bottom: 10px; display: block; }
        .gallery-notes { font-size: 13px; color: #e2e8f0; background-color: #141e30; padding: 10px; border-radius: 4px; word-break: break-word; border-left: 3px solid #38bdf8; }
        .no-data { text-align: center; color: #94a3b8; padding: 20px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-vault">
            <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=150" alt="Purohit Trading Logo" class="app-logo">
            <div class="auth-title">Terminal Locked</div>
            <div class="auth-subtitle">Enter PIN to Access</div>
            <div class="form-group" style="text-align: left; margin-top: 15px;">
                <label>Security PIN:</label>
                <input type="password" id="terminal-pin-input" placeholder="••••" style="text-align: center; letter-spacing: 8px; font-size: 20px;">
            </div>
            <button class="btn-submit-action" onclick="unlockTerminalWithPin()">🔓 Unlock Terminal</button>
        </div>
    </div>

    <div id="main-app" class="container">
        <div class="header-container">
            <div class="header-brand">
                <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=80" alt="Logo" class="header-logo">
                <div class="header"><h1>Purohit Trading</h1></div>
            </div>
            <button class="btn-logout" onclick="lockTerminal()">Lock System</button>
        </div>
        
        <div class="tab-menu">
            <div class="tab-btn active" id="tab1" onclick="switchOption(1)">1. Trade Entry</div>
            <div class="tab-btn" id="tab2" onclick="switchOption(2)">2. Trade History</div>
            <div class="tab-btn" id="tab3" onclick="switchOption(3)">3. Upload Photo & Notes</div>
            <div class="tab-btn" id="tab4" onclick="switchOption(4)">4. Photo History</div>
            <div class="tab-btn" id="tab5" onclick="switchOption(5)">⚙️ Security Settings</div>
        </div>

        <div id="panel1" class="card">
            <input type="hidden" id="edit-trade-id" value="">
            <div class="form-group"><label>Date:</label><input type="date" id="t-date" value="2026-07-02"></div>
            <div class="form-group"><label>Position Name:</label><input type="text" id="t-name" placeholder="e.g., NIFTY CE"></div>
            <div class="row-grid form-group">
                <div class="col-grid"><label>Lot Size:</label><input type="number" id="t-lot-size" value="25" oninput="runCalculation()"></div>
                <div class="col-grid"><label>No. of Lots:</label><input type="number" id="t-lots" value="1" oninput="runCalculation()"></div>
            </div>
            <div class="row-grid form-group">
                <div class="col-grid"><label>Entry Price:</label><input type="number" id="t-entry" value="0.00" step="0.01" oninput="runCalculation()"></div>
                <div class="col-grid"><label>Exit Price:</label><input type="number" id="t-exit" value="0.00" step="0.01" oninput="runCalculation()"></div>
            </div>
            <div class="form-group"><div class="calc-preview">Auto Calculate P&L: <span id="live-pnl">0.00</span></div></div>
            <button class="btn-submit-action" id="btn-save" style="background-color: #0284c7;" onclick="saveNumericTrade()">Save Trade Data</button>
        </div>

        <div id="panel2" class="card hidden">
            <div class="total-banner"><span>Total Profit/Loss:</span><span id="net-pnl">0.00</span></div>
            <div class="table-responsive">
                <table>
                    <thead><tr><th>Date</th><th>Position</th><th>Qty</th><th>Entry</th><th>Exit</th><th>P&L</th><th>Actions</th></tr></thead>
                    <tbody id="numeric-table-rows"><tr><td colspan="7" class="no-data">No data.</td></tr></tbody>
                </table>
            </div>
        </div>

        <div id="panel3" class="card hidden">
            <div class="form-group">
                <label>Select Trade Link:</label>
                <select id="trade-selector"><option value="general">-- General Note --</option></select>
            </div>
            <div class="form-group"><label>Upload Photo (Optional):</label><input type="file" id="t-photo" accept="image/*"></div>
            <div class="form-group"><label>Trading Notes / Logic:</label><textarea id="t-notes" rows="4" placeholder="Apna trading setup ya logic yahan likhein..."></textarea></div>
            <button class="btn-submit-action" style="background-color: #0284c7;" onclick="savePhotoAndNotes()">Add Photo & Notes</button>
        </div>

        <div id="panel4" class="card hidden">
            <div id="gallery-container"><div class="no-data">No history found.</div></div>
        </div>

        <div id="panel5" class="card hidden">
            <div class="auth-title" style="font-size: 18px; text-align: left; margin-bottom: 15px;">Change Terminal PIN</div>
            <div class="form-group">
                <label>Enter New Security PIN:</label>
                <input type="text" id="new-pin-setter" placeholder="e.g. 9999" maxlength="6" style="font-size: 16px; letter-spacing: 3px;">
            </div>
            <button class="btn-submit-action" style="background-color: #22c55e;" onclick="changeTerminalPin()">Update Security PIN</button>
        </div>
    </div>

    <script>
        var MY_SECRET_PIN = "9512"; 
        var tradeDatabase = [];
        var generalNotesTimeline = [];

        window.unlockTerminalWithPin = function() {
            var userEntered = document.getElementById('terminal-pin-input').value;
            if (userEntered.trim() === MY_SECRET_PIN.toString()) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('terminal-pin-input').value = '';
            } else {
                alert("Wrong Security PIN! Try Again.");
            }
        };

        window.lockTerminal = function() {
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            switchOption(1);
        };

        window.changeTerminalPin = function() {
            var inputVal = document.getElementById('new-pin-setter').value.trim();
            if(inputVal.length < 4) {
                alert("PIN must be at least 4 digits long!");
                return;
            }
            MY_SECRET_PIN = inputVal;
            alert("Success! Your Terminal PIN has been changed to: " + MY_SECRET_PIN);
            document.getElementById('new-pin-setter').value = '';
            lockTerminal();
        };

        window.switchOption = function(n) {
            for(var i=1; i<=5; i++) {
                document.getElementById('tab'+i).className = 'tab-btn';
                document.getElementById('panel'+i).className = 'card hidden';
            }
            document.getElementById('tab'+n).className = 'tab-btn active';
            document.getElementById('panel'+n).className = 'card';
            if(n===2) buildNumericTable();
            if(n===4) buildGallery();
        };

        window.runCalculation = function() {
            var size = parseFloat(document.getElementById('t-lot-size').value)||0;
            var lots = parseFloat(document.getElementById('t-lots').value)||0;
            var entry = parseFloat(document.getElementById('t-entry').value)||0;
            var exit = parseFloat(document.getElementById('t-exit').value)||0;
            var qty = size * lots;
            var pnl = (exit - entry) * qty;
            document.getElementById('live-pnl').innerText = pnl.toFixed(2);
            document.getElementById('live-pnl').className = pnl >= 0 ? "profit-text" : "loss-text";
        };

        window.saveNumericTrade = function() {
            var date = document.getElementById('t-date').value;
            var name = document.getElementById('t-name').value || 'Trade Log';
            var size = parseFloat(document.getElementById('t-lot-size').value)||0;
            var lots = parseFloat(document.getElementById('t-lots').value)||0;
            var entry = parseFloat(document.getElementById('t-entry').value)||0;
            var exit = parseFloat(document.getElementById('t-exit').value)||0;
            var qty = size * lots;
            var pnl = (exit - entry) * qty;
            var editId = document.getElementById('edit-trade-id').value;

            if(editId) {
                var idx = tradeDatabase.findIndex(function(x) { return x.id === parseFloat(editId); });
                if(idx !== -1) {
                    tradeDatabase[idx].date = date;
                    tradeDatabase[idx].name = name;
                    tradeDatabase[idx].qty = qty;
                    tradeDatabase[idx].entry = entry;
                    tradeDatabase[idx].exit = exit;
                    tradeDatabase[idx].finalPnL = pnl;
                }
                document.getElementById('edit-trade-id').value = '';
                document.getElementById('btn-save').innerText = 'Save Trade Data';
            } else {
                tradeDatabase.push({id: Date.now(), date: date, name: name, qty: qty, entry: entry, exit: exit, finalPnL: pnl});
            }

            document.getElementById('t-name').value = '';
            document.getElementById('t-entry').value = '0.00';
            document.getElementById('t-exit').value = '0.00';
            switchOption(2);
        };

        window.buildNumericTable = function() {
            var tbody = document.getElementById('numeric-table-rows');
            tbody.innerHTML = '';
            if(tradeDatabase.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="no-data">No data.</td></tr>';
                return;
            }
            var total = 0;
            tradeDatabase.forEach(function(t) {
                total += t.finalPnL;
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>'+t.date+'</td><td>'+t.name+'</td><td>'+t.qty+'</td><td>'+t.entry.toFixed(2)+'</td><td>'+t.exit.toFixed(2)+'</td><td class="'+(t.finalPnL>=0?'profit-text':'loss-text')+'">'+t.finalPnL.toFixed(2)+'</td><td><button class="btn-edit" onclick="triggerEditItem('+t.id+')">Edit</button><button class="btn-delete" onclick="triggerDeleteItem('+t.id+')">Delete</button></td>';
                tbody.appendChild(tr);
            });
            document.getElementById('net-pnl').innerText = total.toFixed(2);
            document.getElementById('net-pnl').className = total >= 0 ? "profit-text" : "loss-text";
        };

        window.triggerEditItem = function(id) {
            var item = tradeDatabase.find(function(x){ return x.id === id; });
            if(!item) return;
            document.getElementById('edit-trade-id').value = item.id;
            document.getElementById('t-date').value = item.date;
            document.getElementById('t-name').value = item.name;
            document.getElementById('t-entry').value = item.entry;
            document.getElementById('t-exit').value = item.exit;
            document.getElementById('btn-save').innerText = 'Update Trade';
            switchOption(1);
            runCalculation();
        };

        window.triggerDeleteItem = function(id) {
            if(confirm("Kya aap is trade ko delete karna chahte hain?")) {
                tradeDatabase = tradeDatabase.filter(function(x) { return x.id !== id; });
                buildNumericTable();
            }
        };

        // FIXED: FileReader safely converts images to Base64 data string
        window.savePhotoAndNotes = function() {
            var text = document.getElementById('t-notes').value.trim();
            if(!text) { alert("Please write some notes text!"); return; }
            
            var fileInput = document.getElementById('t-photo');

            if(fileInput.files && fileInput.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    generalNotesTimeline.push({
                        text: text, 
                        image: e.target.result, // Core base64 image data saved here
                        time: new Date().toLocaleTimeString()
                    });
                    finalizeNotesClearance();
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                generalNotesTimeline.push({
                    text: text, 
                    image: null, 
                    time: new Date().toLocaleTimeString()
                });
                finalizeNotesClearance();
            }
        };

        function finalizeNotesClearance() {
            document.getElementById('t-notes').value = '';
            document.getElementById('t-photo').value = '';
            switchOption(4);
        }

        // FIXED: Image Rendering logic added inside card generation
        window.buildGallery = function() {
            var container = document.getElementById('gallery-container');
            container.innerHTML = '';
            if(generalNotesTimeline.length === 0) {
                container.innerHTML = '<div class="no-data">No history found.</div>';
                return;
            }
            generalNotesTimeline.forEach(function(n) {
                var div = document.createElement('div');
                div.className = 'gallery-item';
                
                // If image exists, render image component safely
                var imageHtml = n.image ? '<img src="' + n.image + '" class="gallery-img">' : '';
                
                div.innerHTML = '<div class="gallery-meta"><span>📌 Note & Setup Log</span><span>' + n.time + '</span></div>' + imageHtml + '<div class="gallery-notes">' + n.text + '</div>';
                container.appendChild(div);
            });
        };
    </script>
</body>
</html>
